# monitoring/grafana/provisioning/dashboards/dashboard.yml
# S3-9 — tells Grafana to auto-load every dashboard JSON file dropped into
# /etc/grafana/dashboards (mounted from monitoring/grafana/dashboards/ in
# docker-compose.yml) instead of requiring manual import per dashboard.

apiVersion: 1

providers:
  - name: "Claims-Cockpit"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
