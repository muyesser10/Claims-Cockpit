# Host ports are ${VAR:-default} so a machine that already runs Postgres or
# Redis can move them from .env instead of needing a docker-compose.override.yml
# (which is gitignored, so a new clone never has one). See docs/runbook.md.
#
# No container_name anywhere on purpose: a fixed name makes `docker compose up`
# fail outright when a container of that name is left over from another clone or
# an older run. Compose's generated <project>-<service>-<n> is unique per
# project, and `docker compose logs <service>` reaches it by service name.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by the init script below. Empty means "skip the role", which the
      # script says out loud rather than failing.
      RAG_READONLY_DB_PASSWORD: ${RAG_READONLY_DB_PASSWORD:-}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      # rag_readonly, the role the Text-to-SQL path runs queries as. The
      # postgres entrypoint runs this ONLY on an empty data volume; an existing
      # one needs the manual command in docs/runbook.md.
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./api:/app/api      #live-reload on code changes
    depends_on:
     db: { condition: service_healthy }
     redis: { condition: service_healthy }
     # /soru proxies to the rag service (api/routers/question.py), so rag is
     # started first. Deliberately service_started and not service_healthy:
     # rag is only healthy once the embedding model is loaded, measured at 42s
     # on a cold hf_cache, and waiting for that would hold back Pano, Kuyruk and
     # Metrikler too - screens that never touch rag. The Soru screen answers 503
     # with a Turkish message during that window (question.py handles an
     # unreachable rag), which is the better trade than a blank cockpit.
     rag: { condition: service_started }


  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # 5. WORKER  (AI Pipeline & Observability)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports: ["${WORKER_METRICS_HOST_PORT:-9100}:9100"]  # prometheus_client.start_http_server — worker/metrics.py
    volumes:
      # Shared with rag: both embed with the same e5 model, and without a volume
      # each container re-downloads 471 MB on every recreate.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - db
      - redis
      - ollama
    restart: always

  # 6. WEB
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # 7. RAG  (/soru — ADR-003)
  # Built from the worker image with a different command: it needs the same
  # sentence-transformers model, and torch in the api image would undo PR #52.
  # A separate container from `worker` on purpose — a question must not wait
  # behind a claim being extracted, and a crash in one must not take the other
  # down.
  rag:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["uvicorn", "rag.main:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - .env
    # expose, not ports: the api reaches this over the compose network. Publishing
    # it would put a read path into claim data on the host, and /ingest's
    # deliberate auth exemption is the one precedent nobody wants repeated.
    expose: ["8100"]
    volumes:
      - hf_cache:/root/.cache/huggingface
    # python -c rather than curl or wget: the image is python:3.11-slim, which
    # ships neither. The endpoint reports model_ready separately from liveness
    # (rag/main.py), and this checks that field - a process answering HTTP while
    # the model is still loading is not ready to take a question.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          body = urllib.request.urlopen("http://localhost:8100/health", timeout=4).read()
          sys.exit(0 if json.loads(body).get("model_ready") else 1)
      interval: 5s
      timeout: 5s
      retries: 10
      # The model load is a 471 MB download on a cold hf_cache and ~26s even
      # when cached. Failures inside this window do not count against retries.
      start_period: 45s
    depends_on:
      db: { condition: service_healthy }
    restart: always

  # 8. PROMETHEUS + GRAFANA  (S3-9 observability)
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - worker
      - rag

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - api
      - worker

volumes:
  db_data:
  ollama_data:
  # The sentence-transformers / HF hub cache, shared by worker and rag.
  hf_cache:
