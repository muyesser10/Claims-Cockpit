services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by the init script below. Empty means "skip the role", which the
      # script says out loud rather than failing.
      RAG_READONLY_DB_PASSWORD: ${RAG_READONLY_DB_PASSWORD:-}
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      # rag_readonly, the role the Text-to-SQL path runs queries as. The
      # postgres entrypoint runs this ONLY on an empty data volume; an existing
      # one needs the manual command in docs/runbook.md.
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./api:/app/api      #live-reload on code changes      
    depends_on:
     db: { condition: service_healthy }
     redis: { condition: service_healthy }
  
  
  ollama:
    image: ollama/ollama:latest
    container_name: claims_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # 5. WORKER  (AI Pipeline & Observability)
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: claims_worker
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    ports: ["9100:9100"]  # prometheus_client.start_http_server — worker/metrics.py
    depends_on:
      - db
      - redis
      - ollama
    restart: always

  # 6. WEB
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: claims_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

  # 7. RAG  (/soru — ADR-003)
  # Built from the worker image with a different command: it needs the same
  # sentence-transformers model, and torch in the api image would undo PR #52.
  # A separate container from `worker` on purpose — a question must not wait
  # behind a claim being extracted, and a crash in one must not take the other
  # down.
  rag:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: claims_rag
    command: ["uvicorn", "rag.main:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file:
      - .env
    # expose, not ports: the api reaches this over the compose network. Publishing
    # it would put a read path into claim data on the host, and /ingest's
    # deliberate auth exemption is the one precedent nobody wants repeated.
    expose: ["8100"]
    depends_on:
      db: { condition: service_healthy }
    restart: always

  # 8. PROMETHEUS + GRAFANA  (S3-9 observability)
  prometheus:
    image: prom/prometheus:latest
    container_name: claims_prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - worker
      - rag

  grafana:
    image: grafana/grafana:latest
    container_name: claims_grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - api
      - worker

volumes:
  db_data:
  ollama_data:
